# One web service serving the API and the built frontend from a single origin.
# The database lives on Neon's free tier; paste its connection string into
# DATABASE_URL when Render prompts for it.
services:
  - type: web
    name: triage-desk
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below makes npm ci skip
    # devDependencies, and the build needs TypeScript and Vite, which live
    # there. Runtime is unaffected -- only dist/ is served.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # sync:false makes Render prompt for these rather than storing secrets
      # in version control.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
